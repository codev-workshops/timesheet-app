openapi: 3.0.0
info:
  title: Timesheet API (hand-written for ZAP API scan)
  version: "1.0"
servers:
  - url: http://localhost:3001
paths:
  /health:
    get:
      responses: { "200": { description: ok } }
  /api/auth/login:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { email: { type: string, example: zap-scanner@example.com } }
      responses: { "200": { description: ok } }
  /api/auth/me:
    get:
      responses: { "200": { description: ok } }
  /api/clients:
    get:
      responses: { "200": { description: ok } }
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: Acme }
                hourly_rate: { type: number, example: 100 }
                email: { type: string, example: acme@example.com }
      responses: { "201": { description: ok } }
    delete:
      responses: { "200": { description: ok } }
  /api/clients/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, example: 1 } }
    get:
      responses: { "200": { description: ok } }
    put:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: Acme }
                hourly_rate: { type: number, example: 100 }
      responses: { "200": { description: ok } }
    delete:
      responses: { "200": { description: ok } }
  /api/work-entries:
    get:
      parameters:
        - { name: client_id, in: query, schema: { type: integer, example: 1 } }
        - { name: start_date, in: query, schema: { type: string, example: "2026-01-01" } }
        - { name: end_date, in: query, schema: { type: string, example: "2026-12-31" } }
      responses: { "200": { description: ok } }
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id: { type: integer, example: 1 }
                date: { type: string, example: "2026-01-15" }
                hours: { type: number, example: 2 }
                description: { type: string, example: Work }
      responses: { "201": { description: ok } }
  /api/work-entries/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, example: 1 } }
    get:
      responses: { "200": { description: ok } }
    put:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                hours: { type: number, example: 3 }
                description: { type: string, example: Work }
      responses: { "200": { description: ok } }
    delete:
      responses: { "200": { description: ok } }
  /api/reports/client/{clientId}:
    parameters:
      - { name: clientId, in: path, required: true, schema: { type: integer, example: 1 } }
    get:
      parameters:
        - { name: start_date, in: query, schema: { type: string, example: "2026-01-01" } }
        - { name: end_date, in: query, schema: { type: string, example: "2026-12-31" } }
      responses: { "200": { description: ok } }
  /api/reports/export/csv/{clientId}:
    parameters:
      - { name: clientId, in: path, required: true, schema: { type: integer, example: 1 } }
    get:
      responses: { "200": { description: ok } }
  /api/reports/export/pdf/{clientId}:
    parameters:
      - { name: clientId, in: path, required: true, schema: { type: integer, example: 1 } }
    get:
      responses: { "200": { description: ok } }
