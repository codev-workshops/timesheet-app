# Timesheet app + ML hours-estimate service.
# Usage (from the repo root): docker compose -f docker/docker-compose.yml up --build
services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3001:3001"
    environment:
      ML_SERVICE_URL: http://ml:8000
      ML_TIMEOUT_MS: "2000"
    volumes:
      - app-data:/app/data
    depends_on:
      ml:
        condition: service_healthy
    restart: unless-stopped

  ml:
    build:
      context: ../ml
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  app-data:
