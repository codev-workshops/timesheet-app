name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws s3 sync ./frontend/dist s3://timesheet-app-prod

      - name: Publish release notes to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          ./scripts/notify-slack.sh

      - name: Tag release in GitHub
        env:
          GITHUB_PAT: ${{ secrets.RELEASE_GITHUB_PAT }}
        run: |
          ./scripts/tag-release.sh

      - name: Charge billing webhook
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          ./scripts/reconcile-billing.sh
